[package]
name = "pg-ffi"
version = "0.1.3"
edition = "2021"
description = "C ABI wrapper around pg-core for the PostGuard .NET SDK (pg-dotnet)"
license = "MIT"
repository = "https://github.com/privacybydesign/postguard"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Exact on purpose: the native library is what E4A.PostGuard ships, and that
# package is published at pg-core's version. With `=`, a pg-core release cannot
# leave this manifest untouched, so it cannot leave pg-ffi unreleased either.
# pg-core/tests/ffi_pin.rs holds the line to this shape.
pg-core = { path = "../pg-core", version = "=0.6.10", features = ["rust", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
ibe = { version = "0.3.0", features = ["cgwkv", "mkem"] }
futures = "0.3"
tokio = { version = "1", features = ["rt"] }
