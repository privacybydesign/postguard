name: Delivery
#
# Pipeline overview
# =================
#
# Release-plz and Docker delivery are combined in one workflow because
# GITHUB_TOKEN-created tags do not trigger new workflow runs. This means a
# versioned Docker image must be built in the same run that release-plz
# creates the release, using its job outputs to pass the version through.
#

on:
  push:
    branches:
      - main
  pull_request:

# The cryptify image keeps the name the cryptify repo publishes today, so no
# deployment has to be repointed. Changing this one line is the whole cost of
# publishing under a different name instead.
# The default for every job; a job that needs more says so itself.
permissions:
  contents: read

env:
  CRYPTIFY_IMAGE: ghcr.io/${{ github.repository_owner }}/cryptify

jobs:

  # ---------------------------------------------------------------------------
  # Release-plz: tag, publish crates, create GitHub releases
  # ---------------------------------------------------------------------------

  release-plz-release:
    name: Release-plz release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
      pg_pkg_version: ${{ steps.parse.outputs.pg_pkg_version }}
      pg_core_version: ${{ steps.parse.outputs.pg_core_version }}
      pg_ffi_version: ${{ steps.parse.outputs.pg_ffi_version }}
      cryptify_version: ${{ steps.parse.outputs.cryptify_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Run release-plz
        id: release-plz
        uses: ./.github/actions/release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Parse released versions
        id: parse
        if: steps.release-plz.outputs.releases_created == 'true'
        run: |
          RELEASES='${{ steps.release-plz.outputs.releases }}'
          PG_PKG_VERSION=$(echo "$RELEASES" | jq -r '.[] | select(.package_name == "pg-pkg") | .version // empty')
          PG_CORE_VERSION=$(echo "$RELEASES" | jq -r '.[] | select(.package_name == "pg-core") | .version // empty')
          echo "pg_pkg_version=$PG_PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "pg_core_version=$PG_CORE_VERSION" >> "$GITHUB_OUTPUT"
          PG_FFI_VERSION=$(echo "$RELEASES" | jq -r '.[] | select(.package_name == "pg-ffi") | .version // empty')
          echo "pg_ffi_version=$PG_FFI_VERSION" >> "$GITHUB_OUTPUT"
          CRYPTIFY_VERSION=$(echo "$RELEASES" | jq -r '.[] | select(.package_name == "cryptify") | .version // empty')
          echo "cryptify_version=$CRYPTIFY_VERSION" >> "$GITHUB_OUTPUT"

  # Compares each newly-cut tag's changelog entry against the commits the tag
  # actually contains (#411, #412): release-plz computes a release PR's
  # changelog hunk when the PR is opened, so a commit that lands on `main`
  # while it is still open ships inside the release but never reaches the
  # entry, and the normal path can never add it after the fact. Deliberately
  # its own job rather than a step inside release-plz-release, so a coverage
  # failure is never confusable with a release failure -- finalize-docker and
  # finalize-cryptify key off release-plz-release's result alone (both
  # `if: always() && needs.build*.result == 'success'`), so this job cannot
  # block the image publish even when it fails. The release still ships;
  # only the record is corrected.
  changelog-coverage:
    name: Changelog coverage
    needs: release-plz-release
    if: needs.release-plz-release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The coverage checker below walks a commit range and reads a
          # changelog at a tag, so it needs full history and tags, not just
          # the commit that triggered this run -- the default shallow
          # checkout makes it report exit 2 (undetermined) on everything.
          fetch-depth: 0
          persist-credentials: false
      - name: Check each newly-cut tag's changelog coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASES: ${{ needs.release-plz-release.outputs.releases }}
        run: scripts/changelog-coverage-report.sh

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    needs: release-plz-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Run release-plz
        uses: ./.github/actions/release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Docker: build, scan, and publish multi-arch image for pg-pkg
  # ---------------------------------------------------------------------------

  # Build each platform on its native runner and push by digest (no tag yet).
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            name: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            name: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: CARGO_PROFILE=edge
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.name }}
          # The `runtime` stage is exempt from the cache on purpose (#394).
          # Its `apt-get update && upgrade` layer is reused until the Dockerfile
          # text changes, so with it cached the image's package versions are
          # frozen at whenever that layer was first built — and the scan below
          # then reports the truth about a layer of unknown age. That is how a
          # 2026-09-01 build shipped a package a security update had already
          # fixed. Re-running apt on a slim image costs seconds; the cargo-chef
          # stages, which are what this cache is for, stay cached.
          no-cache-filters: runtime
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Security scan the amd64 image.
  scan-docker:
    name: Scan Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-amd64
          path: /tmp/digests
      - name: Resolve image reference
        id: ref
        run: |
          # shellcheck disable=SC2012 # the names are sha256 hex digests
          DIGEST=$(ls /tmp/digests | head -1)
          echo "image=ghcr.io/${{ github.repository }}@sha256:${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan image
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        id: scan
        with:
          image: ${{ steps.ref.outputs.image }}
          only-fixed: true
          fail-build: true
          severity-cutoff: critical
          output-format: sarif
      - name: Upload Anchore scan SARIF report
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ !cancelled() }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  # Merge platform digests into a single multi-platform manifest and apply tags.
  # - push to main (no release)  → ghcr.io/.../postguard:edge
  # - push to main (release)     → ghcr.io/.../postguard:edge + postguard:0.3.1
  # - pull request               → ghcr.io/.../postguard:pr-123
  finalize-docker:
    name: Finalize Docker manifest
    needs: [build, scan-docker, release-plz-release]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=ref,event=pr
            type=raw,value=${{ needs.release-plz-release.outputs.pg_pkg_version }},enable=${{ needs.release-plz-release.outputs.pg_pkg_version != '' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          # Both substitutions are argument lists and have to word-split: the
          # first is `-t <tag>` pairs, the second one image reference per digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

  # ---------------------------------------------------------------------------
  # Docker: build, scan, and publish multi-arch image for cryptify
  #
  # Mirrors the pg-pkg jobs above rather than sharing them: the two images have
  # different Dockerfiles, different names and independent version outputs, and
  # a matrix over both would have to carry all three as matrix values, which
  # buys less than it costs in readability.
  #
  # IMAGE NAME: this publishes to the SAME name the cryptify repo publishes to
  # today, so nothing that pulls the image has to change. That required granting
  # this repository push access to the existing `cryptify` GHCR package
  # (package settings -> Manage Actions access -> add privacybydesign/postguard
  # with the Write role), done 2026-08-07 (postguard#293). The alternative,
  # publishing under a new name, would have moved the problem to every
  # deployment that pulls it.
  # ---------------------------------------------------------------------------

  build-cryptify:
    name: Build cryptify (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            name: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            name: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Repo root, not cryptify/: the crate is a workspace member and cannot
          # be planned or built without the root manifest and its siblings.
          context: .
          file: cryptify/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: CARGO_PROFILE=edge
          outputs: type=image,name=${{ env.CRYPTIFY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=cryptify-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=cryptify-${{ matrix.name }}
          # See the same exemption on the pg-pkg build above (#394).
          no-cache-filters: runtime
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cryptify-digest-${{ matrix.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  scan-cryptify:
    name: Scan cryptify image
    needs: build-cryptify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cryptify-digest-amd64
          path: /tmp/digests
      - name: Resolve image reference
        id: ref
        run: |
          # shellcheck disable=SC2012 # the names are sha256 hex digests
          DIGEST=$(ls /tmp/digests | head -1)
          echo "image=${{ env.CRYPTIFY_IMAGE }}@sha256:${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan image
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        id: scan
        with:
          image: ${{ steps.ref.outputs.image }}
          only-fixed: true
          fail-build: true
          severity-cutoff: critical
          output-format: sarif
      - name: Upload Anchore scan SARIF report
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ !cancelled() }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: cryptify

  finalize-cryptify:
    name: Finalize cryptify manifest
    needs: [build-cryptify, scan-cryptify, release-plz-release]
    if: always() && needs.build-cryptify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: cryptify-digest-*
          merge-multiple: true
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.CRYPTIFY_IMAGE }}
          tags: |
            type=edge,branch=main
            type=ref,event=pr
            type=raw,value=${{ needs.release-plz-release.outputs.cryptify_version }},enable=${{ needs.release-plz-release.outputs.cryptify_version != '' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          # Both substitutions are argument lists and have to word-split: the
          # first is `-t <tag>` pairs, the second one image reference per digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.CRYPTIFY_IMAGE }}@sha256:%s ' *)

  # ---------------------------------------------------------------------------
  # pg-ffi and the .NET SDK (#256)
  #
  # E4A.PostGuard ships the pg-ffi native library for five platforms. All five
  # are built here, from the commit this run is on, and handed to `dotnet pack`
  # as workflow artifacts: the package cannot contain a library from any other
  # commit, and there is no release tag to look up and no pin to keep current.
  # Before the fold the SDK downloaded a pinned pg-ffi release, and shipped a
  # pg-core eight patch releases behind `main` without anything noticing.
  #
  # The build and the pack run on pull requests too, so the fan-in is exercised
  # before the release that depends on it. Only the two upload jobs at the end
  # wait for release-plz.
  # ---------------------------------------------------------------------------

  build-ffi:
    name: Build pg-ffi (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            name: linux-x64
            lib: libpg_ffi.so
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            name: linux-arm64
            lib: libpg_ffi.so
          - target: aarch64-apple-darwin
            runner: macos-latest
            name: osx-arm64
            lib: libpg_ffi.dylib
          - target: x86_64-apple-darwin
            runner: macos-latest
            name: osx-x64
            lib: libpg_ffi.dylib
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            name: win-x64
            lib: pg_ffi.dll
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target "$TARGET"
          rustup default stable
      - name: Build pg-ffi
        run: cargo build --release --locked --target ${{ matrix.target }} -p pg-ffi
      # The artifact name is the .NET runtime identifier, which is also the
      # directory pack-dotnet puts the library in.
      - name: Upload the native library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg-ffi-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error
          retention-days: 7

  # Pack E4A.PostGuard around the five libraries above. The version is
  # pg-core's, read by the csproj from pg-core/Cargo.toml.
  pack-dotnet:
    name: Pack E4A.PostGuard
    needs: build-ffi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # No merge-multiple: each artifact lands in a directory of its own name,
      # pg-ffi-<rid>/, because the two Linux libraries share a file name.
      - name: Download the native libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/pg-ffi
          pattern: pg-ffi-*
      - name: Place them where the csproj packs from
        shell: bash
        run: |
          for rid in linux-x64 linux-arm64 osx-arm64 osx-x64 win-x64; do
            mkdir -p "pg-dotnet/src/runtimes/$rid/native"
            cp "$RUNNER_TEMP/pg-ffi/pg-ffi-$rid/"* "pg-dotnet/src/runtimes/$rid/native/"
          done
      - name: Pack
        run: dotnet pack pg-dotnet/src/E4A.PostGuard.csproj --configuration Release --output "$RUNNER_TEMP/nupkg"
      # A missing platform packs without complaint and fails in the consumer's
      # process with DllNotFoundException, so the package is opened and checked.
      - name: Check the package carries all five libraries
        shell: bash
        run: scripts/nupkg-check.sh "$RUNNER_TEMP/nupkg"
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: ${{ runner.temp }}/nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 7

  # Attach the native libraries to the pg-ffi GitHub release, in the archive
  # names and layout the releases have always had.
  release-ffi:
    name: Attach pg-ffi to its release
    needs: [release-plz-release, build-ffi]
    if: needs.release-plz-release.outputs.pg_ffi_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the native libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/pg-ffi
          pattern: pg-ffi-*
      - name: Upload to GitHub release
        shell: bash
        working-directory: ${{ runner.temp }}/pg-ffi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: pg-ffi-v${{ needs.release-plz-release.outputs.pg_ffi_version }}
        run: |
          for rid in linux-x64 linux-arm64 osx-arm64 osx-x64; do
            tar czf "pg-ffi-$rid.tar.gz" -C "pg-ffi-$rid" .
          done
          (cd pg-ffi-win-x64 && zip -q ../pg-ffi-win-x64.zip ./*)
          gh release upload "$TAG" pg-ffi-*.tar.gz pg-ffi-win-x64.zip --clobber

  # E4A.PostGuard is published on every pg-core release, at pg-core's version,
  # like pg-wasm below. The package is the one pack-dotnet built in this run.
  #
  # `environment: nuget` is part of the trusted-publishing policy on nuget.org.
  # A policy naming only this workflow file would let any job in it with
  # `id-token: write` mint a publish key, and this file also publishes crates
  # and pg-wasm. NUGET_USER is a secret of that environment.
  publish-dotnet:
    name: Publish E4A.PostGuard to NuGet
    needs: [release-plz-release, pack-dotnet]
    if: needs.release-plz-release.outputs.pg_core_version != ''
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: ${{ runner.temp }}/nupkg
      # The csproj read its version from pg-core/Cargo.toml and release-plz
      # read the same file; this is the check that they agree before anything
      # irreversible happens.
      - name: Check the package is at the released pg-core version
        shell: bash
        env:
          PG_CORE_VERSION: ${{ needs.release-plz-release.outputs.pg_core_version }}
        run: scripts/nupkg-check.sh "$RUNNER_TEMP/nupkg" "$PG_CORE_VERSION"
      - name: NuGet login (trusted publishing)
        id: login
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: scripts/nuget-login.sh
      - name: Publish to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.api_key }}
        run: |
          dotnet nuget push "$RUNNER_TEMP"/nupkg/*.nupkg --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  # ---------------------------------------------------------------------------
  # npm: publish pg-wasm to npmjs
  # ---------------------------------------------------------------------------

  # pg-wasm is excluded from the workspace because pg-core's "web" feature
  # uses compile_error! on non-wasm32 targets, making cargo package fail.
  # pg-wasm's npm version is kept in sync with pg-core: when pg-core is
  # released, pg-wasm is published at the same version.
  publish-wasm:
    name: Publish pg-wasm to npm
    needs: release-plz-release
    if: needs.release-plz-release.outputs.pg_core_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build pg-wasm (bundler)
        run: wasm-pack build --release -d pkg/bundler --out-name index --scope e4a --target bundler ./pg-wasm

      - name: Build pg-wasm (web)
        run: wasm-pack build --release -d pkg/web --out-name index --scope e4a --target web ./pg-wasm

      - name: Assemble package
        working-directory: pg-wasm/pkg
        run: |
          # Clean up wasm-pack generated files from subdirectories
          rm -f bundler/package.json bundler/.gitignore bundler/README.md
          rm -f web/package.json web/.gitignore web/README.md

          # The manifest and README are committed in pg-wasm/ and copied in
          # verbatim; nothing here writes JSON by hand.
          cp ../package.json package.json
          cp ../README.md README.md

      - name: Check the assembled package
        run: scripts/wasm-package-check.sh pg-wasm/pkg

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set version and publish
        working-directory: pg-wasm/pkg
        run: |
          npm version "${{ needs.release-plz-release.outputs.pg_core_version }}" --no-git-tag-version
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
