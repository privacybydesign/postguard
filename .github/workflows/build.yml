on:
  push:
    branches:
      - main
  pull_request:
    # `edited` included for base retargets (e.g. a stacked PR's base merging):
    # the path filter's verdict depends on the base, and without `edited` a stale
    # verdict stays attached to the unchanged head sha.
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
  workflow_dispatch:

name: Continuous integration

# The default for every job; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  # sonarqube:
  #   name: SonarQube
  #   runs-on: ubuntu-latest
  #   continue-on-error: true
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
  #       with:
  #         fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
  #     - name: SonarQube Scan
  #       uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  # The matrix keys on the crate directory rather than a `pg-` suffix, because
  # `cryptify` does not carry that prefix. This renames the check contexts from
  # `Test workspace (core)` to `Test workspace (pg-core)`; nothing required
  # points at them today (only the two `Wire compat` contexts are required), but
  # a ruleset added later must use the new names.
  test:
    name: Test workspace
    strategy:
      matrix:
        crate: [pg-core, pg-pkg, pg-cli, pg-ffi, cryptify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - if: ${{ matrix.crate == 'pg-core' }}
        run: cargo test --manifest-path pg-core/Cargo.toml --features test,rust,stream
      # cryptify declares no features of its own, so `--all-targets` (what its
      # own CI ran) is the equivalent invocation.
      - if: ${{ matrix.crate == 'cryptify' }}
        run: cargo test --manifest-path cryptify/Cargo.toml --all-targets
      - if: ${{ matrix.crate != 'pg-core' && matrix.crate != 'cryptify' }}
        run: cargo test --manifest-path ${{ matrix.crate }}/Cargo.toml --all-features

  format:
    name: Format workspace
    strategy:
      matrix:
        crate: [pg-core, pg-pkg, pg-cli, pg-ffi, cryptify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - run: cargo fmt --manifest-path ${{ matrix.crate }}/Cargo.toml --all -- --check

  clippy:
    name: Clippy workspace
    strategy:
      matrix:
        crate: [pg-core, pg-pkg, pg-cli, pg-ffi, cryptify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy
          rustup default stable
      - if: ${{ matrix.crate == 'pg-core' }}
        run: cargo clippy --manifest-path pg-core/Cargo.toml --all-targets --features test,rust,stream -- -D warnings
      - if: ${{ matrix.crate == 'cryptify' }}
        run: cargo clippy --manifest-path cryptify/Cargo.toml --all-targets -- -D warnings
      - if: ${{ matrix.crate != 'pg-core' && matrix.crate != 'cryptify' }}
        run: cargo clippy --manifest-path ${{ matrix.crate }}/Cargo.toml --all-targets --all-features -- -D warnings

  # The .NET SDK (#256). pg-dotnet is not a cargo crate, so the matrices above
  # do not reach it. The native library is built here, from this commit, and
  # NativeLibraryTests calls into it: a pg-ffi change that breaks the binding
  # is red on the PR that makes it, not in the next published package.
  dotnet:
    name: .NET SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # Builds pg-ffi and copies it to pg-dotnet/src/runtimes/linux-x64/native.
      - name: Build the native library
        run: pg-ffi/build.sh
      - name: Build
        run: dotnet build pg-dotnet/E4A.PostGuard.slnx --configuration Release
      - name: Test
        run: dotnet test pg-dotnet/E4A.PostGuard.slnx --configuration Release --no-build

  test-wasm-browsers:
    name: Run wasm tests in browsers
    strategy:
      matrix:
        include:
          - browser: chrome
            os: ubuntu-latest
          - browser: firefox
            os: ubuntu-latest
          - browser: safari
            os: macos-latest
    runs-on: ${{ matrix.os }}
    # The suite is 16 tests and finishes in ~25s; a passing job is 2-6 minutes,
    # almost all of it `cargo install wasm-pack` and the release build. 12
    # minutes is ~2x the slowest observed success. The previous budget was 20
    # minutes inside a `nick-fields/retry` wrapper, which on 2026-09-03 turned
    # three wedged safari sessions into ~22-minute jobs with ~17 minutes of
    # silence each (#416).
    timeout-minutes: 12
    env:
      # A timer over the whole `wasm-pack test` run, not per test: it starts
      # after the page navigates and waits, in one clock, for `test result: `
      # to appear across all 16 tests (#453). Safari's green runs take up to
      # ~31s; 70 is ~2x that. It does NOT bound a wedged safaridriver session
      # -- that is what `timeout-minutes` above is for.
      WASM_BINDGEN_TEST_TIMEOUT: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install
        run: cargo install wasm-pack
      - if: ${{ matrix.browser == 'firefox' }}
        run: sudo apt update && sudo apt install firefox
      # A plain `run:`, not `nick-fields/retry`. The wrapper retried genuine
      # non-zero exits (hiding a real failure behind a second roll) and did
      # NOT retry a timeout, which is the only shape this job has ever hit
      # -- `retry_on: error` excludes timeouts, so `max_attempts: 2` never
      # engaged. Dropping it also removes the literal backslash the action
      # input required (`--\${{ matrix.browser }}`), which survived into the
      # resolved command and only worked because a shell stripped it.
      - name: Run wasm-pack browser tests
        run: wasm-pack test --release --headless --${{ matrix.browser }} ./pg-wasm

  # ---------------------------------------------------------------------------
  # Wire compatibility: HEAD-sealed containers must open with published readers
  # (#251 / #260). #261 adds a wire-compat-js job that downloads the artifact
  # this job uploads.
  #
  # The path filter is a step, not an `on: paths:` key, on purpose: a job that
  # is skipped by a path filter never reports, so a required check would sit
  # pending forever on PRs that do not touch the wire surface. This shape always
  # reports and only does the expensive work when it needs to.
  #
  # On `push` the filter is the wrong instrument and is bypassed (#299). It
  # diffs only the push that triggered it, so a commit that reached `main`
  # without this gate ever running is never re-checked afterwards -- and the job
  # still reports green, because "filter said no" and "gate passed" are the same
  # success. That is not hypothetical: #297 changed seven files under
  # `pg-compat/**` and merged during the 2026-08-06 Actions outage with no run
  # at all, and the three `main` runs after it (506144c2, c1682ba7, 1238389b)
  # each reported `Wire compat: success` with `Seal`/`Open` both skipped. So on
  # a push the gate always does the real work: whatever is on `main` is what
  # gets sealed and opened, however it got there.
  # ---------------------------------------------------------------------------
  wire-compat-rust:
    name: Wire compat (published pg-core)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # scripts/changed-paths.sh reads the PR's changed files
    # wire-compat-js (#261) opens the same bytes with the published npm readers.
    # It downloads the artifact the seal step below produces, so it gates on the
    # same outcome the upload gates on rather than re-running the path filter and
    # drifting out of step with it.
    outputs:
      sealed: ${{ steps.seal.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Which paths did this change touch
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FILTERS: |
            wire:
              - 'pg-core/**'
              - 'pg-wasm/**'
              - 'pg-compat/**'
              - 'pg-compat-js/**'
              # pg-core has no lockfile of its own: the bytes HEAD seals are a
              # function of the ROOT lockfile (a bincode-next/ibe/serde bump
              # touches only these two files). Root Cargo.toml also holds the
              # exclude list that keeps pg-compat on crates.io pg-core.
              - 'Cargo.lock'
              - 'Cargo.toml'
              - '.github/workflows/build.yml'
        run: scripts/changed-paths.sh

      # One decision, read by every step below, so the push override cannot be
      # applied to the seal but forgotten on the open.
      - name: Decide whether to do the real work
        id: gate
        shell: bash
        env:
          WIRE_CHANGED: ${{ steps.changes.outputs.wire }}
        run: |
          if [[ "$WIRE_CHANGED" == "true" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy,rustfmt
          rustup default stable

      - name: Seal the sample set with HEAD
        id: seal
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          cargo run --locked -p pg-core --features stream --example seal-samples \
            -- "$RUNNER_TEMP/wire-compat-artifacts"

      # Hand-off to wire-compat-js (#261). Uploaded before the reader runs so a
      # red gate still leaves the bytes that broke it.
      - name: Upload the sample set
        if: steps.seal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wire-compat-artifacts-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/wire-compat-artifacts
          retention-days: 7

      - name: Open it with published pg-core
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          PG_COMPAT_ARTIFACTS: ${{ runner.temp }}/wire-compat-artifacts
        run: cargo test --manifest-path pg-compat/Cargo.toml --locked

  # pg-compat is outside the workspace, so the per-crate fmt/clippy matrices do
  # not cover it. Kept separate from wire-compat-rust on purpose: a new stable
  # rustc lint must not red a required check named after wire compatibility,
  # nor pre-empt the seal/read steps that answer it.
  pg-compat-lint:
    name: Lint pg-compat
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Which paths did this change touch
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FILTERS: |
            wire:
              - 'pg-compat/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - '.github/workflows/build.yml'
        run: scripts/changed-paths.sh
      - if: steps.changes.outputs.wire == 'true'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy,rustfmt
          rustup default stable
      - name: Format pg-compat
        if: steps.changes.outputs.wire == 'true'
        run: cargo fmt --manifest-path pg-compat/Cargo.toml --all -- --check
      - name: Clippy pg-compat
        if: steps.changes.outputs.wire == 'true'
        run: cargo clippy --manifest-path pg-compat/Cargo.toml --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # Public-API semver gate (#253). Fails a PR that breaks pg-core's or pg-wasm's
  # public API without declaring the break.
  #
  # Versions here are bumped by release-plz, not by the PR that makes the
  # change, so "declared" means the conventional-commit `!` marker that
  # release-plz turns into a major bump. The marker is read off the PR title
  # into SEMVER_RELEASE_TYPE; `edited` is already in this file's trigger list,
  # so adding the `!` to the title re-runs the gate.
  #
  # Same always-reports shape as wire-compat-rust: the path filter is a step,
  # not an `on: paths:` key, so a required check never sits pending.
  # ---------------------------------------------------------------------------
  semver-checks:
    name: Public API semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # scripts/changed-paths.sh reads the PR's changed files
    steps:
      # pg-wasm is not published to crates.io, so its baseline is origin/main
      # rather than a registry version, and the full history has to be here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Which paths did this change touch
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FILTERS: |
            api:
              - 'pg-core/**'
              - 'pg-wasm/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/semver-checks.sh'
              - 'scripts/semver-checks-test.sh'
              - '.github/workflows/build.yml'
        run: scripts/changed-paths.sh

      # Stubs cargo, so it needs no toolchain and runs in under a second. It
      # covers the 100-vs-101 exit-code mapping the gate depends on: 100 is a
      # semver violation, 101 is the tool or the build failing.
      - name: Test the gate script
        if: steps.changes.outputs.api == 'true'
        shell: bash
        run: ./scripts/semver-checks-test.sh

      - if: steps.changes.outputs.api == 'true'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable

      # Pinned release binary rather than `cargo install` (a five-minute build)
      # or a fourth third-party action. Bump the version and the digest together.
      - name: Install cargo-semver-checks
        if: steps.changes.outputs.api == 'true'
        shell: bash
        env:
          VERSION: 0.51.0
          SHA256: cacadafaa5cd27ae6d05a74a103266917ebab4c5e43c898360e177d4fbf06a65
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cargo-semver-checks.tar.gz" \
            "https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v${VERSION}/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/cargo-semver-checks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-semver-checks.tar.gz" -C "$HOME/.cargo/bin" cargo-semver-checks

      # The PR title, not the commit subject: PRs are squash-merged here, so the
      # title is what release-plz and the Conventional Commit check read. Passed
      # through the environment rather than interpolated into the script, so a
      # PR title cannot inject shell.
      #
      # The title `!` is the only accepted declaration. A `BREAKING CHANGE:`
      # footer in the PR *body* is deliberately not accepted: this repo's
      # squash_merge_commit_message is COMMIT_MESSAGES, so the body never reaches
      # the squashed commit, and release-plz reads commits. Honouring a body-only
      # footer would pass the gate on a `fix(pg-core):` PR that release-plz then
      # publishes as a patch release of a breaking change.
      - name: Read the breaking-change declaration off the PR title
        id: declared
        if: steps.changes.outputs.api == 'true'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ ^[a-zA-Z]+(\([^\)]*\))?!: ]]; then
            echo "Breaking change declared in the PR title; a major bump is allowed."
            echo "release_type=major" >> "$GITHUB_OUTPUT"
          else
            echo "No '!' in the PR title; any breaking change will fail the gate."
          fi

      - name: Check the public API
        if: steps.changes.outputs.api == 'true'
        shell: bash
        env:
          SEMVER_RELEASE_TYPE: ${{ steps.declared.outputs.release_type }}
        run: ./scripts/semver-checks.sh
  # The Node half of the same gate (#261): the containers wire-compat-rust
  # sealed must also open with the published npm readers in COMPATIBILITY.md's
  # support window. It downloads rather than re-seals, so both halves are held
  # to the same bytes and a non-deterministic sealer cannot hide between them.
  #
  # `if: !cancelled()` rather than the default: a red wire-compat-rust is
  # exactly when it is worth knowing whether the JS readers broke the same way,
  # and the artifact is uploaded before that job's read step for this reason.
  # Without it, `needs` would skip this job on the run where it has the most to
  # say.
  # ---------------------------------------------------------------------------
  wire-compat-js:
    name: Wire compat (published pg-wasm/pg-js)
    runs-on: ubuntu-latest
    needs: wire-compat-rust
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Every step below is behind the seal outcome, not just the download.
      # `outcome` is 'skipped' when the path filter said no (nothing to open,
      # report success) and 'failure' when sealing itself broke (wire-compat-rust
      # owns that failure; do not report it twice).
      - if: needs.wire-compat-rust.outputs.sealed == 'success'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pg-compat-js/package-lock.json

      - name: Download the sample set
        if: needs.wire-compat-rust.outputs.sealed == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wire-compat-artifacts-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/wire-compat-artifacts

      # ci, not install: the readers are pinned by pg-compat-js/package-lock.json,
      # and a gate that quietly resolved a different reader would be measuring
      # something other than the support window.
      - name: Install the published readers
        if: needs.wire-compat-rust.outputs.sealed == 'success'
        shell: bash
        working-directory: pg-compat-js
        run: npm ci

      - name: Open the set with published pg-wasm/pg-js
        if: needs.wire-compat-rust.outputs.sealed == 'success'
        shell: bash
        working-directory: pg-compat-js
        env:
          PG_COMPAT_ARTIFACTS: ${{ runner.temp }}/wire-compat-artifacts
        run: npm test

  # ---------------------------------------------------------------------------
  # Single required check consolidating the two halves above (#262). The
  # repoint happened in #296: "Wire compat" is the one required context, and the
  # two per-language names are no longer required individually. Since #299 it is
  # also the sole context of the `main: required checks` ruleset, whose
  # `bypass_actors` is empty -- so unlike classic protection (`enforce_admins`
  # is still false) this name cannot be merged past with `--admin`. Renaming
  # this job silently disarms that ruleset; rename the ruleset's context in the
  # same change.
  #
  # `if: !cancelled()` for the same reason as wire-compat-js above: this job
  # must still run and report when an upstream half failed, or the required
  # check sits pending forever instead of turning red.
  # ---------------------------------------------------------------------------
  wire-compat:
    name: Wire compat
    runs-on: ubuntu-latest
    needs: [wire-compat-rust, wire-compat-js]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - name: Require both halves to have passed
        shell: bash
        run: |
          echo "wire-compat-rust: ${{ needs.wire-compat-rust.result }}"
          echo "wire-compat-js: ${{ needs.wire-compat-js.result }}"
          if [[ "${{ needs.wire-compat-rust.result }}" != "success" || "${{ needs.wire-compat-js.result }}" != "success" ]]; then
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The registry half of the wiring guards (#318).
  #
  # `pg-core/tests/ci_wiring.rs` asserts that the job above is still *named*
  # `Wire compat`. This asserts the other end of that link: that the `main`
  # ruleset still *requires* that context. Neither end is sufficient. A context
  # required but not produced blocks nothing (#299 measured that an absent check
  # is as dangerous as a red one); a context produced but not required enforces
  # nothing while every test stays green.
  #
  # Both #272 and postguard-js#222 declared this end unreachable from CI, on the
  # assumption it needs an admin credential. Measured in #318: it does not. On a
  # public repo the effective-rules endpoint answers 200 to the built-in token
  # at any permission level, so `contents: read` below is already more than this
  # needs, and no secret is involved.
  #
  # Deliberately NOT part of the `Wire compat` aggregator and deliberately not a
  # required context: this reads a live third-party API, and a GitHub API outage
  # must not become an unmergeable repo. Exit 2 (undetermined) is therefore a
  # distinct outcome from exit 1 (drift) -- see scripts/ruleset-drift.sh.
  #
  # And deliberately no `schedule:`. A nightly would detect drift during quiet
  # periods, but a disarmed gate can only do harm when something merges, and
  # every merge here passes through a `pull_request` and a `push` run of this
  # workflow. Running at exactly the moment the gate is relied upon also makes
  # the result unmissable, which a scheduled run is not -- the ticket's own
  # warning was that a drift detector nobody reads is itself a silent gate.
  # ---------------------------------------------------------------------------
  ruleset-drift:
    name: Ruleset still requires the gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the reporter's `gh issue create` below (#422). Only the
      # required_status_checks half of the ruleset is asserted anywhere in
      # this job: the review-requirement half lives in classic protection
      # (`required_approving_review_count`), and `/branches/main/protection`
      # 403s for the Actions token, so it cannot be read from CI at all.
      # `postguard-js` asserts its review rule only because it keeps that
      # rule in a ruleset instead.
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog-coverage checker's self-test below (#412) runs
          # against fixtures that are real tags in this repo's history, so the
          # job needs full history and tags -- the default shallow checkout
          # makes the coverage script report exit 2 (undetermined) on every
          # one of them instead of exercising the case.
          fetch-depth: 0
          persist-credentials: false

      - name: Compare the live ruleset against the guard's constant
        shell: bash
        env:
          # Not required for the read -- unauthenticated works on a public repo.
          # It is passed because the runner's anonymous budget is 60/hour per
          # shared IP, and exhausting it would show up as exit 2 noise.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/ruleset-drift-report.sh

      - name: Exit codes still mean what the gate reports
        shell: bash
        run: scripts/ruleset-drift-test.sh

      - name: Test the changelog-coverage checker
        shell: bash
        run: scripts/changelog-coverage-test.sh

      - name: Test the wasm-package checker
        shell: bash
        run: scripts/wasm-package-check-test.sh

      - name: Test the changelog-coverage reporter
        shell: bash
